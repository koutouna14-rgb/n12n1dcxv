# ================================================================
# StopESP Configuration
# ================================================================

# Config format version. Managed automatically: when you update the plugin, any new
# options are added to this file (your values are kept, a .bak copy is saved). Don't edit.
config-version: 6

# Whether to send the thanks/support message to ops when they join.
show-thanks-message: true

# The distance (in blocks) at which protected blocks are revealed to the player.
reveal-radius: 20.0

# Per-world reveal-radius overrides (optional).
# If a world is listed here, its value overrides the global reveal-radius.
world-radius-overrides:
  # world_nether: 15.0
  # world_the_end: 12.0

# Worlds where StopESP is ACTIVE.
# In all other worlds, the system will do nothing (better performance).
enabled-worlds:
  - world
  - world_nether
  - world_the_end

# How many server ticks between each visibility scan.
# 1 = every tick (smoothest, most CPU). 2-4 = good balance.
scan-interval: 1

# How many consecutive scan cycles a block must be invisible before it gets hidden again.
# Higher = less flickering, but slower hide reaction. Default: 3
visibility-buffer: 3

# Frustum culling: skip blocks that are behind the player (outside ~180° FOV).
# Disabling this reveals blocks behind you earlier, but uses more CPU.
frustum-culling: true

# Material sent to the client as a fake block to replace hidden ones.
# CONTEXT = disguise each hidden block as the natural block it is touching (grass under a grass floor,
#           dirt in a dirt tunnel, deepslate, sand, tuff, ...). Falls back to AUTO where nothing natural is adjacent.
# AUTO    = per-dimension (Stone / Deepslate below Y0 / Netherrack / End Stone)
# Other options: AIR, STONE, DEEPSLATE, NETHERRACK, END_STONE (or any block name)
# Chunks that are already indexed keep their old fake blocks until a restart or /stopesp off + on.
fake-block-mode: CONTEXT

# MAXIMUM worker threads for async visibility calculations. The pool grows and shrinks on
# demand between performance.min-worker-threads and this value.
# -1 = auto (CPU cores, at least 2, at most 8).
worker-threads: -1

# Blocks that will be HIDDEN from the player until they are nearby.
# Master switch for hiding ores (every *_ORE block and ANCIENT_DEBRIS in protected-blocks).
# false = ores are never hidden; only base blocks (chests, redstone, beds...) and Anti-ESP
# entities are protected. Takes effect for newly loaded chunks; restart to apply everywhere.
hide-ores: false

# Rewrite the chunk packet per player so protected blocks are replaced BEFORE the chunk is sent
# (the real blocks never reach the client, not even briefly or to a packet sniffer).
# It checks itself: if the packet layout isn't what it expects it leaves the packet alone and
# the older "hide right after sending" path is used. Set false to always use that older path.
chunk-rewrite:
  enabled: true

# Also hide a built-in set of base-building blocks (furnaces, brewing stands, enchanting
# tables, beacons, respawn anchors, cauldrons, crafters, vaults, copper chests, workstations,
# decorated pots...). Added on top of protected-blocks; unknown names are skipped.
base-blocks-preset: true

